name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar, por ejemplo v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  release:
    # Solo este job escribe. Nada mas necesita permisos.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar build
        run: python -m pip install --upgrade pip build

      - name: Resolver el tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "valor=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "valor=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar que el tag coincide con la versión del paquete
        run: |
          TAG="${{ steps.tag.outputs.valor }}"
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG  version=$VERSION"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::el tag $TAG no coincide con la versión $VERSION de pyproject.toml"
            exit 1
          fi

      - name: Tests antes de publicar
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests/ -q

      - name: Construir wheel y sdist
        run: python -m build

      - name: Crear la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.valor }}
        run: |
          # Las notas salen del CHANGELOG: se toma la seccion de la version.
          NOTES=$(awk -v tag="v${{ steps.tag.outputs.valor }}" \
            '$0 ~ "^## \\["tag"\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          [ -z "$NOTES" ] && NOTES="Sin notas en el CHANGELOG."
          gh release create "$TAG" dist/* --title "$TAG" --notes "$NOTES"
        # El token viene de github.token, que genera GitHub automaticamente:
        # no hay ningun secreto que configurar en el repositorio.

      - name: Subir el paquete a PyPI (opcional)
        if: ${{ false }}
        run: |
          echo "Si querés publicar en PyPI, hace falta un token:"
          echo "  1. Creá un API token en https://pypi.org/manage/account/token/"
          echo "  2. Guardalo como secreto del repo:"
          echo "       Settings > Secrets and variables > Actions > New repository secret"
          echo "       Name: PYPI_API_TOKEN"
          echo "  3. Descomentá este paso y cambiá el if de arriba a:"
          echo "       if: \${{ secrets.PYPI_API_TOKEN != '' }}"
          echo "Ningun secreto lo maneja este repo ni el workflow."